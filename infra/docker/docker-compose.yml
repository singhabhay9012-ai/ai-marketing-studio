name: ai-marketing-platform

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: marketing_admin
      POSTGRES_PASSWORD: local_dev_password # local development only — never reuse
      POSTGRES_DB: marketing_platform
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketing_admin -d marketing_platform']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for local development (swap for S3 / R2 in staging/prod)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local_minio
      MINIO_ROOT_PASSWORD: local_minio_password
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio_data:/data']

volumes:
  postgres_data:
  redis_data:
  minio_data:
