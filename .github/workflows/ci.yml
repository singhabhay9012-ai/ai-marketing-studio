name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketing_admin
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: marketing_platform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marketing_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://marketing_admin:ci_password@localhost:5432/marketing_platform_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci-access
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci-refresh
      STORAGE_SIGNING_SECRET: ci-storage-signing-secret
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
