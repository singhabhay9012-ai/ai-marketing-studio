name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # Gitleaks lists the PR's commits

jobs:
  # Branch protection on main requires this job, so every gate below blocks merging.
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketing_admin
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: marketing_platform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marketing_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://marketing_admin:ci_password@localhost:5432/marketing_platform_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci-access
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci-refresh
      STORAGE_SIGNING_SECRET: ci-storage-signing-secret
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false # findings fail the job; no PR write access needed
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (production dependencies, moderate and above)
        run: pnpm audit --prod --audit-level moderate
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Typecheck and lint the e2e suite
        run: pnpm typecheck:e2e && pnpm lint:e2e
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browser (Chromium)
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end smoke test
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
